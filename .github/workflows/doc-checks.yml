name: Doc checks

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-checks:
    name: Decision log, links and private data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v4.2.0
        with:
          version: "0.13.7"
      - run: uv python install 3.13.13
      - run: uv sync --locked
      - run: uv run pytest tools/tests
