# gitleaks configuration (decision 0001). The default rules apply. Add an [[allowlists]] table only
# for a reviewed false positive, and give its reason.

[extend]
useDefault = true

[[allowlists]]
description = "Example camera_key in the calibration TOML sample of recording-files/SPEC.md section 15: a made-up hash, not a credential (ADR-VPD9)"
paths = ['''recording-files/SPEC\.md''']
regexes = ['''9c41d07a55e2b318''']

[[allowlists]]
description = "Channel kind names of the Parquet descriptor (recording-files/parts/parquet-descriptor.md), in lists of the golden generator and its tests: format names, not credentials (ADR-G21H)"
paths = ['''tools/.*\.py''', '''recording-files/tests/.*\.py''']
regexes = ['''(RAW_)?KEYPOINTS_3D''']
